
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=BBH+Bogle&family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">

    <!-- Website name -->
    <title>George Coles | Historical Archive</title>

    <!-- CSS -->
    <link rel="stylesheet" href="history.css">

    <!-- Website logo -->
    <link rel="icon" href="someguy.jpeg">
</head>

<body>

    <!-- Navigation bar -->
    <nav class="navbar">

        <button class="logo" onclick="showPanel('home')">
            GEORGE COLES
        </button>

        <div class="nav-links">
            <button onclick="showPanel('home')">Home</button>
            <button onclick="showPanel('history')">History</button>
            <button onclick="showPanel('legacy')">Legacy</button>
        </div>

    </nav>

    <!-- Main content -->
    <main>

        <!-- Home panel -->
        <div id="home" class="panel active">

            <section class="hero">

                <span class="eyebrow">
                    HISTORICAL ARCHIVE · 1810–1875
                </span>

                <h1>George Coles</h1>

                <h2>
                    A pioneer of political change in Prince Edward Island.
                </h2>

                <p>
                    Discover the life, political career and legacy
                    of George Coles.
                </p>

                <button onclick="showPanel('history')">
                    Explore history →
                </button>

            </section>

        </div>

        <!-- History panel -->
        <div id="history" class="panel">

            <h1>Early History</h1>

            <p>Learn about George Coles's early life.</p>

        </div>

        <!-- Legacy panel -->
        <div id="legacy" class="panel">

            <h1>His Legacy</h1>

            <p>Discover his impact on Prince Edward Island.</p>

        </div>

    </main>

    <!-- JavaScript -->
    <script src="history.js"></script>

</html>
